<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- TODO 8.1: layout:title-pattern → "<Page title> | Student Manager" -->
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">Student Manager</title>

    <!-- TODO 8.2: Bootstrap OFFLINE + style.css via th:href="@{...}" -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/students}">Student Manager</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <!-- TODO 8.3: th:href + th:classappend active based on ${activeMenu} -->
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/students}"
                       th:classappend="${activeMenu == 'list'} ? 'active'">Danh sách</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/students/new}"
                       th:classappend="${activeMenu == 'new'} ? 'active'">Thêm mới</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4 flex-grow-1">
    <!-- TODO 8.4: Flash messages – successMessage (alert-success) and errorMessage (alert-danger) -->
    <div class="alert alert-success alert-dismissible fade show" role="alert"
         th:if="${successMessage}" th:text="${successMessage}">
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert"
         th:if="${errorMessage}" th:text="${errorMessage}">
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- TODO 8.5: Content fragment – replaced by child pages -->
    <div layout:fragment="content"></div>
</main>

<footer class="bg-dark text-white-50 text-center py-3">
    <!-- TODO 8.6: Current year via #temporals -->
    &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> HSF302 – Student Manager
</footer>

<!-- TODO 8.7: Bootstrap OFFLINE JS bundle -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
