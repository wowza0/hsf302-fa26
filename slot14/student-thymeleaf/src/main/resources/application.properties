spring.application.name=student-thymeleaf
server.port=8080

# ===== SQL Server =====
# encrypt=true là m?c ??nh c?a mssql-jdbc ? c?n trustServerCertificate=true khi ch?y local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StudentDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
# update: t? t?o/c?p nh?t b?ng theo entity, gi? nguyên d? li?u
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# T?t Open Session In View (tránh c?nh báo khi kh?i ??ng)
spring.jpa.open-in-view=false
# Không c?n khai báo dialect ? Hibernate 7 t? nh?n di?n SQLServerDialect

# T?t cache ?? s?a HTML không c?n restart
spring.thymeleaf.cache=false

# Message cho validation / type mismatch
spring.messages.basename=messages
spring.messages.encoding=UTF-8
